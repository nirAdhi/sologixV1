# ============================================================
# Sologix - LOCAL TEST copy (runs on your own PC, not the server)
#   Open http://localhost:8080 after start-local.bat finishes.
#   Uses its own empty database; nothing here touches production.
# ============================================================
name: sologix-local
services:
  mysql:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: local_root_test_only
      MYSQL_DATABASE: solar_booking
      MYSQL_USER: sologix
      MYSQL_PASSWORD: local_db_test_only
    volumes:
      - local_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plocal_root_test_only"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: sologix-local-app
    restart: "no"
    env_file:
      - local.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: solar_booking
      DB_USER: sologix
      DB_PASSWORD: local_db_test_only
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "127.0.0.1:8080:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - local_uploads:/app/backend/uploads

volumes:
  local_mysql:
  local_uploads:
